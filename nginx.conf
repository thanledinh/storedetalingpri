# index.html ghi tên miền https://daily.zappa.vn (canonical, og:url, og:image). Mở bằng link *.sslip.io thì đổi thành
# chính link đó, để gửi link sslip qua Facebook / Zalo không bị đẩy sang daily.zappa.vn
map $host $site {
    default        https://daily.zappa.vn;
    ~\.sslip\.io$  https://$host;
}

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    # (application/json, application/octet-stream: khuôn phim, xe .glb và ảnh môi trường .hdr của trang xe — nén còn ~60%)
    gzip_types text/html text/css application/javascript image/svg+xml application/json application/octet-stream;
    gzip_min_length 1024;

    # Trang chính: luôn lấy bản mới để cập nhật giá có hiệu lực ngay
    location = /index.html {
        add_header Cache-Control "no-cache";
        sub_filter 'https://daily.zappa.vn' $site;
        sub_filter_once off;
    }

    # Mã JS (room.js, car-stage.js): luôn hỏi lại máy chủ — sửa file là có hiệu lực ngay, không đổi thì chỉ trả 304
    location ~* \.js$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Ảnh, mô hình 3D, video: cập nhật giữ nguyên tên file nên cũng hỏi lại (ETag) — không đổi thì 304, không tải lại
    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
