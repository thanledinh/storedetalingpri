server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Trang chính: luôn lấy bản mới để cập nhật giá có hiệu lực ngay
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Mã JS (room.js, car-stage.js): luôn hỏi lại máy chủ — sửa file là có hiệu lực ngay, không đổi thì chỉ trả 304
    location ~* \.js$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Ảnh, mô hình 3D, video: cập nhật giữ nguyên tên file nên cũng hỏi lại (ETag) — không đổi thì 304, không tải lại
    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
